spring:
  profiles:
    active: secret
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

server:
  port: 8080


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: daily-app
    distribution:
      percentiles-histogram:
        http.server.requests: true
