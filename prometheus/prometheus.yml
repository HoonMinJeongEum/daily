global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'spring-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
        labels: { service: 'daily-app' }

  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']
        labels: { service: 'mysql' }
